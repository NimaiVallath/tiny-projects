<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Volatility Field Lab model comparison</title>
  <desc id="desc">Fictional returns are split chronologically; three models are compared on a later holdout using error scores and value-at-risk breaches.</desc>
  <rect width="960" height="510" rx="24" fill="#f3f1eb"/><rect x="24" y="24" width="912" height="462" rx="18" fill="#fff" stroke="#e0dfd8"/>
  <text x="52" y="65" font-family="sans-serif" font-size="12" fill="#637b73">TIME SERIES / FORECAST LAB</text>
  <text x="52" y="104" font-family="sans-serif" font-size="29" font-weight="700" fill="#242b31">Volatility Field Lab</text>
  <text x="52" y="131" font-family="sans-serif" font-size="14" fill="#6d7478">Three forecasts. One honest, later holdout.</text>
  <g font-family="sans-serif"><rect x="52" y="153" width="250" height="62" rx="10" fill="#f4f5f1"/><text x="69" y="178" font-size="10" fill="#6d7478">TRAINING WINDOW</text><text x="69" y="201" font-size="18" font-weight="700" fill="#242b31">96 sessions</text>
  <rect x="313" y="153" width="250" height="62" rx="10" fill="#f4f5f1"/><text x="330" y="178" font-size="10" fill="#6d7478">LATER TEST WINDOW</text><text x="330" y="201" font-size="18" font-weight="700" fill="#242b31">24 sessions</text>
  <rect x="574" y="153" width="334" height="62" rx="10" fill="#f4f5f1"/><text x="591" y="178" font-size="10" fill="#6d7478">GARCH PERSISTENCE (α + β)</text><text x="591" y="201" font-size="18" font-weight="700" fill="#242b31">0.95 · grid-fitted</text></g>
  <rect x="52" y="237" width="856" height="145" rx="10" fill="#fafbf9"/><rect x="604" y="255" width="267" height="109" fill="#e1eee8"/>
  <line x1="52" y1="309" x2="908" y2="309" stroke="#d3d8d3"/><polyline points="604,293 635,322 666,286 697,315 728,300 759,337 790,291 821,320 852,304 871,310" fill="none" stroke="#242b31" stroke-width="2.5"/>
  <text x="615" y="277" font-family="sans-serif" font-size="11" fill="#51786d">GARCH 95% reference band</text>
  <text x="52" y="414" font-family="sans-serif" font-size="16" font-weight="700" fill="#242b31">Holdout scorecard</text>
  <g font-family="sans-serif" font-size="13" fill="#48575a"><text x="52" y="447">Rolling 20 · QLIKE / MAE variance / VaR breaches</text><text x="52" y="472">EWMA and grid-fitted GARCH · lower error scores are better</text></g>
  <text x="52" y="504" font-family="sans-serif" font-size="11" fill="#6d7478">Generated teaching data · a small sample is not evidence of future performance</text>
</svg>
