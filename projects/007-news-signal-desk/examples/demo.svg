<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">News Signal Desk preview</title><desc id="desc">A local financial news evaluation dashboard with match coverage, sentiment buckets and event rows.</desc>
  <rect width="960" height="560" rx="24" fill="#f3f4ef"/><rect x="26" y="24" width="908" height="512" rx="20" fill="#fff" stroke="#d7dedb"/>
  <text x="54" y="68" font-family="sans-serif" font-size="14" fill="#547069">RESEARCH / EVENT STUDY</text><text x="54" y="108" font-family="sans-serif" font-size="30" font-weight="700" fill="#172a27">News Signal Desk</text>
  <text x="54" y="136" font-family="sans-serif" font-size="14" fill="#60716d">Do model-scored headlines line up with issuer returns?</text>
  <g font-family="sans-serif"><rect x="54" y="160" width="195" height="82" rx="12" fill="#f4f7f5"/><text x="72" y="188" font-size="12" fill="#60716d">ARTICLES</text><text x="72" y="222" font-size="27" font-weight="700" fill="#172a27">8</text>
  <rect x="264" y="160" width="195" height="82" rx="12" fill="#f4f7f5"/><text x="282" y="188" font-size="12" fill="#60716d">1-DAY MATCH</text><text x="282" y="222" font-size="27" font-weight="700" fill="#172a27">6 / 8</text>
  <rect x="474" y="160" width="195" height="82" rx="12" fill="#f4f7f5"/><text x="492" y="188" font-size="12" fill="#60716d">ISSUERS</text><text x="492" y="222" font-size="27" font-weight="700" fill="#172a27">3</text>
  <rect x="684" y="160" width="222" height="82" rx="12" fill="#f4f7f5"/><text x="702" y="188" font-size="12" fill="#60716d">WINDOW BASIS</text><text x="702" y="222" font-size="16" font-weight="700" fill="#172a27">Trading closes</text></g>
  <text x="54" y="282" font-family="sans-serif" font-size="17" font-weight="700" fill="#172a27">Next available session · mean close-to-close return</text>
