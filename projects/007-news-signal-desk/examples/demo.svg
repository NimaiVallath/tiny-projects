  <line x1="260" y1="300" x2="260" y2="424" stroke="#b8c6c1"/><line x1="260" y1="320" x2="535" y2="320" stroke="#c66c5d" stroke-width="15" stroke-linecap="round"/><line x1="260" y1="361" x2="295" y2="361" stroke="#d3a145" stroke-width="15" stroke-linecap="round"/><line x1="260" y1="402" x2="330" y2="402" stroke="#3c9274" stroke-width="15" stroke-linecap="round"/><text x="560" y="325" fill="#60716d">3 events</text><text x="320" y="366" fill="#60716d">1 event</text><text x="355" y="407" fill="#60716d">2 events</text></g>
